# CPU smoke: captioning with the v2 LLM head (random tiny Qwen3-Next fed the joint states + a prompt) on
# synthetic image/caption pairs. Same schedule as configs/_smoke/caption_tiny.yaml.
_include: [../../_base/train_defaults.yaml, ../../model/v2_tiny.yaml]
run: {name: caption_tiny, dir: runs/_smoke_v2, seed: 0}
task:
  name: captioning
  max_target_len: 12
  llm_prompt_template: "mô tả bức ảnh :"
  metrics: [bleu4, rougeL]
  generation: {num_beams: 2, max_new_tokens: 4, min_new_tokens: 1}
data:
  train: {kind: synthetic_caption, split: train, options: {num_samples: 16, captions_per_image: 2, image_size: 32, seed: 1}}
  evals:
    dev: {kind: synthetic_caption, split: dev, options: {num_samples: 8, captions_per_image: 2, image_size: 32, seed: 1}}
  batch_size: 2
  eval_batch_size: 4
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  transform: {source: tower}
optim: {lr: 1.0e-3}
schedule: {kind: cosine, warmup_ratio: 0.25}
train: {max_steps: 4, grad_accum_steps: 2, amp: {enabled: false}, log_every: 1}
eval: {every_steps: 2, every_epochs: null, selection_metric: dev/bleu4, selection_mode: max, final_splits: [dev]}
checkpoint: {every_steps: 2, every_epochs: null, keep_last_n: 1}
logging: {tensorboard: false}
