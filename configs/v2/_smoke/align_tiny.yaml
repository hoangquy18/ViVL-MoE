# CPU smoke: v2 dense alignment (sigmoid loss, RADIO stub frozen, W_v trainable: preset sparse) with the text
# tower from the distill smoke run. Data and schedule as configs/_smoke/stage2_tiny.yaml (not included: its
# v1 tiny model would deep-merge into v2_tiny): 64 captions over 32 images, 4 steps = 1 epoch.
_include: [../../_base/train_defaults.yaml, ../../model/v2_tiny.yaml]
run: {name: align_tiny, dir: runs/_smoke_v2, seed: 7}
task: {name: contrastive}
init_from: {path: runs/_smoke_v2/distill_tiny/checkpoints/best.pt, load: [text_encoder]}
data:
  train:
    kind: synthetic_pairs
    split: train
    root: runs/_smoke_v2/synthetic_data
    options: {num_samples: 64, captions_per_image: 2, image_size: 32, seed: 1}
  evals:
    ktvic_dev:
      kind: synthetic_pairs
      split: dev
      root: runs/_smoke_v2/synthetic_data
      options: {num_samples: 8, captions_per_image: 2, image_size: 32, seed: 1}
  batch_size: 4
  eval_batch_size: 4
  num_workers: 0
  transform: {source: tower}
  tokenizer: {vi_max_len: 16}
optim: {lr: 1.0e-3, freeze_preset: sparse}
schedule: {kind: cosine, warmup_ratio: 0.25}
train: {max_steps: 4, epochs: null, grad_accum_steps: 2, amp: {enabled: false}, log_every: 1}
eval: {every_steps: 2, every_epochs: null, selection_metric: ktvic_dev/rsum, selection_mode: max}
checkpoint: {every_steps: 2, every_epochs: null, keep_last_n: 2, save_best: true}
logging: {tensorboard: false}
