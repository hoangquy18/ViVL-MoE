# Ablation: N_r = 2 routed experts, top_k 2 (paper Sec. 6.4). Needs its own upcycled checkpoint:
#   python scripts/upcycle.py --config configs/moe/upcycle.yaml --out runs/moe_upcycled_nr2/upcycled.pt model_overrides.moe.num_routed=2
_include: [../moe/sparse_train.yaml]
run: {name: ablation_nr2}
model: {from_checkpoint: runs/moe_upcycled_nr2/upcycled.pt}
model_overrides: {moe: {num_routed: 2, top_k: 2}}
init_from: {path: runs/moe_upcycled_nr2/upcycled.pt, load: [all]}
