# Ablation: N_s = 4 shared experts (paper Sec. 6.4). Needs its own upcycled checkpoint:
#   python scripts/upcycle.py --config configs/moe/upcycle.yaml --out runs/moe_upcycled_ns4/upcycled.pt model_overrides.moe.num_shared=4
_include: [../moe/sparse_train.yaml]
run: {name: ablation_ns4}
model: {from_checkpoint: runs/moe_upcycled_ns4/upcycled.pt}
model_overrides: {moe: {num_shared: 4}}
init_from: {path: runs/moe_upcycled_ns4/upcycled.pt, load: [all]}
