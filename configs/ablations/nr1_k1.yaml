# Ablation: N_r = 1 routed expert (top_k must be 1, paper Sec. 6.4). Needs its own upcycled checkpoint:
#   python scripts/upcycle.py --config configs/moe/upcycle.yaml --out runs/moe_upcycled_nr1/upcycled.pt model_overrides.moe.num_routed=1 model_overrides.moe.top_k=1
_include: [../moe/sparse_train.yaml]
run: {name: ablation_nr1_k1}
model: {from_checkpoint: runs/moe_upcycled_nr1/upcycled.pt}
model_overrides: {moe: {num_routed: 1, top_k: 1}}
init_from: {path: runs/moe_upcycled_nr1/upcycled.pt, load: [all]}
