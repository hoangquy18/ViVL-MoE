# Ablation: N_s = 2 shared experts (paper Sec. 6.4). Needs its own upcycled checkpoint:
#   python scripts/upcycle.py --config configs/moe/upcycle.yaml --out runs/moe_upcycled_ns2/upcycled.pt model_overrides.moe.num_shared=2
_include: [../moe/sparse_train.yaml]
run: {name: ablation_ns2}
model: {from_checkpoint: runs/moe_upcycled_ns2/upcycled.pt}
model_overrides: {moe: {num_shared: 2}}
init_from: {path: runs/moe_upcycled_ns2/upcycled.pt, load: [all]}
