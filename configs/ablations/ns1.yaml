# Ablation: N_s = 1 shared experts (paper Sec. 6.4). Needs its own upcycled checkpoint:
#   python scripts/upcycle.py --config configs/moe/upcycle.yaml --out runs/moe_upcycled_ns1/upcycled.pt model_overrides.moe.num_shared=1
_include: [../moe/sparse_train.yaml]
run: {name: ablation_ns1}
model: {from_checkpoint: runs/moe_upcycled_ns1/upcycled.pt}
model_overrides: {moe: {num_shared: 1}}
init_from: {path: runs/moe_upcycled_ns1/upcycled.pt, load: [all]}
