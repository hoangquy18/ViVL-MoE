# UIT-ViIC captioning (paper Sec. 6.1 / Table 2; COCO-style json with variable captions per image).
_include: [_downstream_defaults.yaml]
run: {name: uitviic_caption}
task:
  name: captioning
  max_target_len: 48
  metrics: [bleu4]
  bleu_tokenizer: "13a"
  generation: {num_beams: 5, max_new_tokens: 40, min_new_tokens: 0, length_penalty: 1.0, early_stopping: false}   # HF-parity: the paper only states beam 5
data:
  train:
    kind: uitviic
    root: /Users/gos/Documents/Moe/moe/uit-vilc/uitvic_dataset   # this Mac (see _base/data_paths.yaml); uitvic_captions_{train,test}2017.json
    split: train
    holdout: {from_split: train, to_split: dev, ids_file: configs/data/splits/uitviic_dev_image_ids.json}
  evals:
    dev:
      kind: uitviic
      root: /Users/gos/Documents/Moe/moe/uit-vilc/uitvic_dataset
      split: dev
      holdout: {from_split: train, to_split: dev, ids_file: configs/data/splits/uitviic_dev_image_ids.json}
    test: {kind: uitviic, root: /Users/gos/Documents/Moe/moe/uit-vilc/uitvic_dataset, split: test}
  tokenizer: {decoder_max_len: 48}
eval: {selection_metric: dev/bleu4, final_splits: [test]}
