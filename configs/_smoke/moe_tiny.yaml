# CPU smoke: 4 sparse-training steps (contrastive task) of the tiny upcycled model on synthetic pairs
# with the routing probe every 2 steps on its own cadence (eval every 4; paper Sec. 5.4 / 6.5 in miniature).
#   python scripts/train.py --config configs/_smoke/moe_tiny.yaml
# 64 captions over 32 images -> one caption per image per epoch -> 8 micro-batches of 4, accum 2 -> 4 steps.
_include: [../_base/train_defaults.yaml]
run: {name: moe_tiny, dir: runs/_smoke, seed: 7}
task: {name: contrastive}
model: {from_checkpoint: runs/_smoke/upcycle_tiny/upcycled.pt}   # inherits the MoE topology
init_from: {path: runs/_smoke/upcycle_tiny/upcycled.pt, load: [all]}
data:
  train:
    kind: synthetic_pairs
    split: train
    root: runs/_smoke/synthetic_data
    options: {num_samples: 64, captions_per_image: 2, image_size: 32, seed: 1}
  evals:
    dev:
      kind: synthetic_pairs
      split: dev
      root: runs/_smoke/synthetic_data
      options: {num_samples: 8, captions_per_image: 2, image_size: 32, seed: 1}
  batch_size: 4
  eval_batch_size: 4
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  tokenizer: {vi_max_len: 16}
optim: {lr: 1.0e-4, freeze_preset: sparse}
schedule: {kind: cosine, warmup_ratio: 0.25}
train: {max_steps: 4, epochs: null, grad_accum_steps: 2, amp: {enabled: false}, log_every: 1}
eval: {every_steps: 4, every_epochs: null, selection_metric: dev/rsum, selection_mode: max}
checkpoint: {every_steps: 2, every_epochs: null, keep_last_n: 2, save_best: true}
analysis: {routing_probe: {split: dev, every_steps: 2, max_batches: 2}}
logging: {tensorboard: false}
