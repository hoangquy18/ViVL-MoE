[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vivlmoe"
version = "0.1.0"
description = "Clean re-implementation of ViVL-MoE (One Tower, Many Experts) with DDP training, YAML configs and ViMMU-Bench downstream tasks."
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  # torch==2.2.2 is the newest wheel for this Intel Mac; use torch>=2.6 on the CUDA training box (see docs/training.md).
  "torch>=2.2.2",
  "torchvision>=0.17.2",
  "transformers>=4.57.1,<5",
  "safetensors>=0.4",
  "pyyaml>=6,<7",
  "numpy>=1.26,<2",
  "pillow>=10",
  "tqdm>=4.66",
  "tensorboard>=2.15",
  "rouge-score>=0.1.2",
  "pycocoevalcap>=1.2",
  "sentencepiece>=0.2",
  "protobuf>=4",
  "pandas>=2",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
wandb = ["wandb>=0.16"]
hfdata = ["datasets>=2.19"]
viet = ["underthesea>=6.8"]
parity = ["evaluate>=0.4", "sacrebleu>=2.4"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[tool.setuptools.packages.find]
include = ["vivlmoe*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dataset"]  # raw corpus dump (contains the legacy project's code)

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: long-running integration tests (CLI smoke chain)",
  "cuda: requires a CUDA device",
  "hf_cache: requires the small models in the local Hugging Face cache",
  "gloo: spawns a 2-process gloo group on CPU",
]
timeout = 900
addopts = "-m 'not slow and not cuda and not hf_cache' -q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
